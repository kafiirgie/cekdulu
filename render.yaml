services:
  - type: web
    name: cekdulu-api
    runtime: python
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python deploy/start_backend.py
    healthCheckPath: /api/health
    envVars:
      - key: CEKDULU_DATA_MODE
        value: fixture
      - key: SECTORS_CREDIT_BUDGET
        value: "0"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
