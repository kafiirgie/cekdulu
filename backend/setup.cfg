# Mutation-testing config (scoped run). See skill verification-and-mutation-testing.
# Run from backend/:  .venv/bin/python -m mutmut run
#
# Without source_paths the tool refuses to start:
#   "Could not figure out where the code to mutate is."

[mutmut]
source_paths =
    app

# Scope: the Lane C decision core (claim splitting, JEV guards, answer assembly).
# Every mutant re-runs the whole suite, so the full app/ package (~5.7k mutatable
# nodes) would run for hours; this set is the part whose logic is under review.
only_mutate =
    app/ai/jev.py
    app/ai/provider.py
    app/ai/fallback.py
    app/ai/tanya.py
    app/ai/guard.py
    app/catalog.py

# REQUIRED for a hermetic run. The tool copies sources into a sandbox and runs the
# suite there, so every path the tests read must be carried across. config.py resolves
# contract/ relative to the repo root (parents[2]), i.e. the sandbox root, so contract/
# must sit there or every rule lookup raises FileNotFoundError.
also_copy =
    ../contract
    ../data
    scripts
